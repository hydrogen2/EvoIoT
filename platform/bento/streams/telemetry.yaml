# Telemetry Stream - MQTT to TimescaleDB
# Subscribes to telemetry topic and writes readings to TimescaleDB

input:
  mqtt:
    urls:
      - tcp://mosquitto:1883
    topics:
      - "buildings/+/agents/+/telemetry"
    client_id: "platform-telemetry"
    qos: 1
    auto_replay_nacks: true

pipeline:
  processors:
    # Add metadata. rawtag_id: if the source already knows the point's
    # identity (e.g. the SSH collector reverse-maps EnOS data back to raw
    # BACnet) it states rawtag_id and the PG trigger passes it through;
    # otherwise it's null and the trigger computes it from the template.
    - mapping: |
        root = this
        root.id = uuid_v4()
        root.source_type = "sensor"
        root.tenant_id = this.building_id.or("default")
        root.rawtag_id = this.rawtag_id.or(null)
        root.confidence = 1.0
        root.created_at = now()
        root.raw_payload = this.string()

output:
  sql_insert:
    driver: postgres
    dsn: "postgres://bento_writer:bento_dev_password@postgres:5432/postgres?sslmode=disable"
    table: evoiot.readings
    columns:
      - id
      - tenant_id
      - source_type
      - rawtag_id
      - point_type
      - value
      - unit
      - raw_payload
      - observed_at
      - confidence
    args_mapping: |
      root = [
        this.id,
        this.tenant_id,
        this.source_type,
        this.rawtag_id,
        this.point_type,
        this.value,
        this.unit,
        this.raw_payload,
        this.agent_read_at,
        this.confidence
      ]
    batching:
      count: 100
      period: 1s
