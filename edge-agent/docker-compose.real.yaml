# EvoIoT Edge Agent — real BMS deployment
# Runs on an edge device that sits on the BACnet/IP network, publishing to a
# remote platform's Mosquitto. Copy .env.example to .env and configure.
#
#   docker compose -f docker-compose.real.yaml up -d --build
#
# The agent is read-only against the BMS: Who-Is discovery +
# ReadPropertyMultiple + presentValue polling. It never writes.

name: evoiot-edge

services:
  edge-agent:
    build: .
    container_name: edge-agent
    # BACnet/IP needs UDP 47808 broadcast on the physical BMS LAN —
    # host networking, bridge mode would swallow Who-Is broadcasts.
    network_mode: host
    environment:
      BUILDING_ID: "${BUILDING_ID:?set BUILDING_ID in .env}"
      AGENT_ID: "${AGENT_ID:-agent-001}"
      # This device's own IP on the BACnet network (BAC0 binds to it)
      BACNET_IP: "${BACNET_IP:?set BACNET_IP in .env (this device's IP on the BMS LAN)}"
      BACNET_SUBNET: "${BACNET_SUBNET:-24}"
      # Platform Mosquitto, e.g. tcp://10.65.18.104:1883
      MQTT_URL: "${MQTT_URL:?set MQTT_URL in .env}"
      POLL_INTERVAL: "${POLL_INTERVAL:-60}"
      DISCOVERY_INTERVAL: "${DISCOVERY_INTERVAL:-300}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - edge_data:/data
    restart: unless-stopped

volumes:
  edge_data:
